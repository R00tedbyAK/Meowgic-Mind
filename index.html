<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meowgic-Mind 🐾✨</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="stars"></div>
    <div id="app" class="container">

        <!-- Screen 1: Welcome -->
        <div id="screen-welcome" class="screen active">
            <div class="magic-icon">🔮</div>
            <h1>Would you like to play with numbers?</h1>
            <p class="subtitle">Step into the realm of Meowgic...</p>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="nextScreen('screen-img1')">YES</button>
                <button class="btn btn-secondary" onclick="window.location.href='no.html'">NO</button>
            </div>
        </div>

        <!-- Screen 2: Img 1 -->
        <div id="screen-img1" class="screen">
            <h2>Focus your mind...</h2>
            <div class="image-wrapper" onclick="nextScreen('screen-img2')">
                <img src="disco.jpg" alt="Disco">
                <div class="click-hint">Click the image to Continue</div>
            </div>
        </div>

        <!-- Screen 3: Img 2 -->
        <div id="screen-img2" class="screen">
            <h2>The connection is forming...</h2>
            <div class="image-wrapper" onclick="nextScreen('screen-game')">
                <img src="shammi.jpg" alt="Shammi">
                <div class="click-hint">Click the image to Continue</div>
            </div>
        </div>

        <!-- Screen 4: Game -->
        <div id="screen-game" class="screen">
            <h2>Enter a number between 1 and 100</h2>
            <div class="input-group">
                <input type="number" id="num" min="1" max="100" placeholder="e.g. 27">
            </div>

            <div class="btn-group">
                <button class="btn btn-primary" id="startBtn">Start Magic</button>
                <button class="btn btn-secondary" id="resetBtn" style="display:none">Reset</button>
            </div>

            <div class="card" id="instructionArea" style="display:none">
                <div class="magic-sparkle">✨</div>
                <div id="instructionText" class="instruction-text"></div>
            </div>

            <div class="btn-group mt-4">
                <button class="btn btn-primary glow" id="nextBtn" style="display:none">Next Step</button>
            </div>

            <div id="final" class="result"></div>
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
